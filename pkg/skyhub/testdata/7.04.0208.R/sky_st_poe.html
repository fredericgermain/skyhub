<head>

<link type="text/css" rel="stylesheet" href="assets/css/main.css"/>
<link type="text/css" rel="stylesheet" href="assets/css/ie6.css"/>

<script type="text/javascript" src="assets/js/libs/jquery/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="assets/js/libs/jquery/jquery.effects.core.js"></script>

			<script type="text/javascript" src="assets/js/libs/DD_belatedPNG_0.0.8a.js"></script>
		<![endif]-->
<script type="text/javascript" src="assets/js/utilities.js"></script>
<script type="text/javascript" src="assets/js/libs/modernizr.touch.js"></script>

<script   type="text/javascript">
var if_allow_submit=false;
var defaultInterval = 5;
var mode = 'AUTO'; //ADSL/AUTO/WANOE to get the old GUI
var isWANOE = 0;
function loadInterval()
{
      setInterval("location.reload();", defaultInterval*1000); // Jquery function to refresh page in regular interval
}
</script>
</head>
<!--onload="loadInterval();">-->
<body onload="loadInterval();" >
<div style="width:650px; height:450px; padding:20px;">
  <div class="section-heading">
    <h3>Connection Status</h3>
		<a href="javascript: if_allow_submit=false; self.close();" class="link link-close right">Close</a>
  </div>
  <form name="poe_st" method="post" action="sky_st_poe.sky" onsubmit="return if_allow_submit;">
    <script type="text/javascript">
    <!--hide
    var wanStatus = '1_ipoe_0_1_0.101_203.0.113.1_02:00:00:00:00:01_255.255.252.0_203.0.113.2_ptm0.1_203.0.113.3, 203.0.113.4_67:03:06_2001:db8:1::1/64_fe80::22_&nbsp;_&nbsp;_2001:db8:2::/56_fe80::2aa:bbff:fecc:dde2';
    var wanOEstat = '&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;_&nbsp;';
    var wanarr = wanStatus.split('_');
    var wanOEarr = wanOEstat.split('_');
    var WanLstat = 'Disconnected_None_0_0_Disconnected';
	var WanOEconn_stat = WanLstat.split('_');
    var Modem_stat = 'Connected';
    var routerMode = 'AUTO';
    if_allow_submit = false;
    
    if(wanOEarr[0] != "&nbsp;") {
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-conn-time-text" >Connection Time</span><span id="router-conn-status-conn-time-value" >');
        document.write(wanOEarr[9]);
        document.write('</span></div>');
    
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-server-text">Connecting to Server</span><span id="router-conn-status-server-value">');
        if((WanOEconn_stat[0] == "Disconnected") && (WanOEconn_stat[4] == "Disconnected")) {
            document.write('DSL down');
            document.write('</span></div>');
        } else {
            document.write(WanOEconn_stat[0]);
            document.write('</span></div>');
    
            document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-nego-text" >Negotiation</span><span id="router-conn-status-nego-value" >');
            document.write('WANOE');
            document.write('</span></div>');
    
            document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-auth-text" >Authentication</span><span id="router-conn-status-auth-value" >');
            document.write('AUTO');
            document.write('</span></div>');
    
            document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv4-addr-text" >IPv4 Address</span><span id="router-conn-status-ipv4-addr-value" >');
            document.write(wanOEarr[3]);
            document.write('</span></div>');
    
            document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv4-mask-text" >IPv4 Network Mask</span><span id="router-conn-status-ipv4-mask-value" >');
            document.write(wanOEarr[5]);
            document.write('</span></div>');
            
            document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv6-global-text" >IPv6 Global Address</span><span id="router-conn-status-ipv6-global-value" >');
            document.write(wanOEarr[10]);
            document.write('</span></div>');
            
            document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv6-local-text" >IPv6 Link Local Address</span><span id="router-conn-status-ipv6-local-value" >');

            var ipV6LinkLocalAddressPrefix = wanOEarr[15];
            var ipV6LinkLocalAddr = ipV6LinkLocalAddressPrefix.split('/');
            document.write(ipV6LinkLocalAddr[0]);

            document.write('</span></div>');
                
            document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv6-prefix-text" >IPv6 Delegated Prefix</span><span id="router-conn-status-ipv6-prefix-value" >');
            document.write(wanOEarr[14]);
            document.write('</span></div>');
        }
    } else if(wanarr[0] != '&nbsp;' || Modem_stat != 'Disconnected') {
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-conn-time-text" >Connection Time</span><span id="router-conn-status-conn-time-value">');
        document.write(wanarr[11]);
        document.write('</span></div>');
        
    
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-server-text" >Connecting to Server</span><span id="router-conn-status-server-value">');
        document.write(Modem_stat);
        document.write('</span></div>');
    
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-nego-text" >Negotiation</span><span id="router-conn-status-nego-value">');
        document.write();
    
        switch(wanarr[1]) {
            case "bridge":
                document.write('BRIDGE');
                break;
            case "pppoa":
                document.write('PPPoA');
                break;
            case "pppoe":
                if( ( mode == 'WANOE' || mode == 'AUTO' ) )
                {
                    if( isWANOE == 1 )
                        document.write('WANoE');
                    else
                        document.write('PPPoE');
                }
                else
                {
                    document.write('PPPoE');
                }
                break;
            case "ipoa":
                document.write('IPoA');
                break;
            case "ipoe":
                document.write('MER');
                break;
            default:
                document.write('---');
        }
        document.write('</span></div>');
    
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-auth-text" >Authentication</span><span id="router-conn-status-auth-value">');
		document.write('AUTO');
		document.write('</span></div>');
    
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv4-addr-text" >IPv4 Address</span><span id="router-conn-status-ipv4-addr-value">');
        document.write(wanarr[5]);
        document.write('</span></div>');
    
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv4-mask-text" >IPv4 Network Mask</span><span id="router-conn-status-ipv4-mask-value" >');
        document.write(wanarr[7]);
        document.write('</span></div>');

        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv6-global-text" >IPv6 Global Address</span><span id="router-conn-status-ipv6-global-value" >');
        document.write(wanarr[12]);
        document.write('</span></div>');

        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv6-local-text" >IPv6 Link Address</span><span id="router-conn-status-ipv6-local-value" >');

        if (wanarr[1] == 'pppoa')
        {
            wanarr[17] = '';
        }

        if (wanarr[17])
        {
            wanarr[17].length > 12 ? linkaddr = wanarr[17] : linkaddr="&nbsp;";
        }
        else
        {
            linkaddr = '&nbsp;';
        }
        var index = linkaddr.indexOf("/");
        (index > 0) ?  document.write( linkaddr.substring(0, index)) : document.write(linkaddr);
        document.write('</span></div>');

        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-ipv6-prefix-text" >IPv6 Delegated Prefix</span><span id="router-conn-status-ipv6-prefix-value" >');
        document.write(wanarr[16]);
        document.write('</span></div>');
        
    } else {
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-conn-time-text" >Connection Time</span><span id="router-conn-status-conn-time-value" >');
        document.write('00:00:00');
        document.write('</span></div>');
    
        document.write('<div class="row-holder"> <span class="label w250" id="router-conn-status-server-text" >Connecting to Server</span><span id="router-conn-status-server-value" >');
        if(((WanOEconn_stat[0] == "Disconnected") && (WanOEconn_stat[4] == "Disconnected")) || (Modem_stat == "Disconnected")) {
            document.write('DSL down');
            document.write('</span></div>');
        } else {
            document.write('IPv4 Status:');
            document.write(WanOEconn_stat[0]);
            document.write(' IPv6 Status:');
            document.write(WanOEconn_stat[4]);
            document.write('</span></div>');
    
            document.write('<div class="row-holder"> <span class="label w250">IP Address</span><span>');
            document.write('---');
            document.write('</span></div>');
    
            document.write('<div class="row-holder"> <span class="label w250">Network Mask</span><span>');
            document.write('---');
            document.write('</span></div>');
    
        }
    }
    // done hiding -->
    </script>
      <input name="interval" size="4" maxlength="4" value="5" type="hidden">
    <input name="todo" value="reload" type="hidden"/>
    <input name="this_file" value="sky_st_poe.html" type="hidden"/>
    <input name="next_file" value="sky_st_poe.html" type="hidden"/>
	<input name="sessionKey" value="1234567890" type="hidden"/>
  </form>
  <div class="buttons-holder">
	<a href="javascript: if_allow_submit=true; stdAction(document.forms[0],'disconnect');" {dial_up_down_enable} class="btn32 btn-clr-secondary png" id="router-conn-status-disconnect-button"><span class="png">Disconnect</span></a>
	<a href="javascript: if_allow_submit=true; stdAction(document.forms[0],'connect');" {dial_up_down_enable} class="btn32 btn-clr-primary png" id="router-conn-status-connect-button"><span class="png">Connect</span></a>
	</div>
</div>
</body>
</html>
